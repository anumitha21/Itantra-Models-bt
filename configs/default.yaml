      tokens_path: "models/stt/tokens.txt"
      quantization: "int8"
      format: "onnx"
      architecture: "Conformer-CTC"
      runtime: "sherpa-onnx"
      source: "AI4Bharat / parismitaglobalsolutions"
      expected_sample_rate: 16000

    # -------------------------------------------------------------
    # 2. OpenAI Whisper Tiny (INT8 CTranslate2 via faster-whisper)
    # -------------------------------------------------------------
    whisper_tiny_hi:
      name: "whisper"
      model_size: "tiny"
      version: "openai-whisper-tiny"
      language: "hi"
      path: "models/whisper/tiny"
      quantization: "int8"
      format: "ctranslate2"
      architecture: "Encoder-Decoder-Transformer"
      runtime: "ctranslate2"
      source: "OpenAI / Systran"
      expected_sample_rate: 16000

    whisper_tiny_ta:
