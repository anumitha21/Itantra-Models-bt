# Configuration for Offline AI Backend Foundation

models_dir: "models"
results_csv: "results/results.csv"
num_threads: 2
sample_rate: 16000
log_level: "INFO"

models:
  stt:
    # -------------------------------------------------------------
    # 1. AI4Bharat IndicConformer (INT8 ONNX via sherpa-onnx)
    # -------------------------------------------------------------
    hi:
      name: "indicconformer"
      version: "1.0.0"
      language: "hi"
      path: "models/stt/hi/model.int8.onnx"
      tokens_path: "models/stt/tokens.txt"
      quantization: "int8"
      format: "onnx"
      architecture: "Conformer-CTC"
      runtime: "sherpa-onnx"
      source: "AI4Bharat / parismitaglobalsolutions"
      expected_sample_rate: 16000

    ta:
      name: "indicconformer"
      version: "1.0.0"
      language: "ta"
      path: "models/stt/ta/model.int8.onnx"
      tokens_path: "models/stt/tokens.txt"
      quantization: "int8"
      format: "onnx"
      architecture: "Conformer-CTC"
      runtime: "sherpa-onnx"
      source: "AI4Bharat / parismitaglobalsolutions"
      expected_sample_rate: 16000

    te:
      name: "indicconformer"
      version: "1.0.0"
      language: "te"
      path: "models/stt/te/model.int8.onnx"
      tokens_path: "models/stt/tokens.txt"
      quantization: "int8"
      format: "onnx"
      architecture: "Conformer-CTC"
